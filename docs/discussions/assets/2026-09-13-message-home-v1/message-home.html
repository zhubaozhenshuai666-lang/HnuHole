<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>消息首页</title>
<style>
:root{color-scheme:dark;--page:#0b0f14;--ink:#e9edf2;--secondary:#a8b3bf;--quiet:#788492;--ice:#b4d9e9;--red:#dd6370;--line:#1b232c}
*{box-sizing:border-box}
html,body{margin:0;width:402px;height:874px;overflow:hidden;background:#000}
body{font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0}
.phone{position:relative;width:402px;height:874px;overflow:hidden;border-radius:36px;background:var(--page)}
.phone:after{position:absolute;inset:0;content:"";border:1px solid #303a45;border-radius:36px;pointer-events:none;z-index:10}
.status{position:absolute;top:14px;left:27px;right:24px;height:20px;display:flex;align-items:center;justify-content:space-between;font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;font-weight:600;letter-spacing:.05px}
.status-right{display:flex;gap:10px;align-items:center}
.bars{height:14px;display:flex;gap:2px;align-items:flex-end}
.bars i{display:block;width:3px;border-radius:1px;background:var(--ink)}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:10px}.bars i:nth-child(4){height:13px}
.battery{height:11px;width:23px;border:1px solid #a5b3c2;border-radius:3px;position:relative;padding:1px;margin-left:1px}
.battery:before{content:"";display:block;width:17px;height:7px;border-radius:1.5px;background:var(--ink)}
.battery:after{content:"";position:absolute;right:-3px;top:2px;width:1.5px;height:5px;background:#a5b3c2;border-radius:1px}
.nav{position:absolute;left:16px;right:16px;top:47px;height:48px;display:flex;align-items:center;justify-content:space-between}
.nav h1{position:absolute;left:50%;transform:translateX(-50%);font-size:20px;font-weight:600;line-height:28px;letter-spacing:1px;margin:0}
.icon-button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.back{width:11px;height:11px;border-left:1.8px solid var(--ink);border-bottom:1.8px solid var(--ink);transform:rotate(45deg);margin-left:4px}
.quick-links{position:absolute;top:120px;left:24px;right:24px;height:93px;display:grid;grid-template-columns:repeat(3,1fr)}
.quick-link{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:13px;position:relative;min-width:0}
.quick-icon{width:47px;height:47px;border-radius:50%;background:#15212a;display:flex;align-items:center;justify-content:center;position:relative;color:var(--ice)}
.quick-label{font-size:13px;font-weight:500;line-height:20px;white-space:nowrap;color:#ced7e1;letter-spacing:.2px}
.badge{height:18px;min-width:18px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff5f5;display:flex;justify-content:center;align-items:center;font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;font-weight:600;line-height:18px;letter-spacing:0}
.quick-icon .badge{position:absolute;right:-4px;top:-3px;box-shadow:0 0 0 2px var(--page)}
.red-dot{width:6px;height:6px;border-radius:50%;background:var(--red);display:block}
.quick-icon .red-dot{position:absolute;right:2px;top:1px;box-shadow:0 0 0 2px var(--page)}
.identity-bar{position:absolute;left:24px;right:24px;top:218px;height:45px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end}
.identity-switch{width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-right:-9px;position:relative}
.identity-dot{height:15px;width:15px;border-radius:50%;background:var(--ice);position:relative}
.identity-dot .red-dot{position:absolute;top:-2px;right:-3px;box-shadow:0 0 0 2px var(--page)}
.conversations{position:absolute;left:1px;right:1px;top:263px}
.conversation{height:88px;display:grid;grid-template-columns:46px minmax(0,1fr) 48px;align-items:center;column-gap:13px;padding:0 25px;position:relative}
.conversation.pinned{background:#10161d}
.conversation:after{position:absolute;bottom:0;left:84px;right:25px;height:1px;content:"";background:var(--line);opacity:.7}
.conversation.pinned:last-child:after{left:25px;opacity:1}
.conversation:last-child:after{display:none}
.pinned-group{border-bottom:1px solid #1c2731}
.avatar{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.avatar.owner{background:#243b48}.avatar.owner i{width:17px;height:17px;background:#acd4e5;border-radius:50%}
.avatar.a{background:#2f3943}.avatar.a i{width:16px;height:16px;border-radius:4px;background:#b6c4d2}
.avatar.b{background:#393445}.avatar.b i{width:16px;height:16px;transform:rotate(45deg);background:#c0b5d2;border-radius:1px}
.avatar.c{background:#2f3b3e}.avatar.c i{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid #abc4c5;transform:translateY(-1px)}
.avatar.d{background:#3b3834}.avatar.d i{width:18px;height:18px;border:4px solid #cbbdab;border-radius:50%}
.avatar.e{background:#30394a}.avatar.e i{width:17px;height:17px;border:2.5px solid #b0bfd4;transform:rotate(45deg);border-radius:3px}
.conversation-copy{min-width:0;align-self:center;padding-bottom:1px}
.name-line{display:flex;gap:6px;align-items:center;min-height:23px}
.name{font-size:15px;font-weight:500;line-height:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.15px}
.pin{flex:none;opacity:.8}
.summary{font-size:12.5px;line-height:20px;margin-top:5px;color:#8d9aa8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04px}
.conversation.unread .summary{color:#b0bcc8}
.conversation-meta{align-self:stretch;padding-top:21px;display:flex;flex-direction:column;align-items:flex-end;gap:11px}
.time{font-family:"Helvetica Neue","PingFang SC",Arial,sans-serif;font-size:10.5px;line-height:16px;font-weight:400;color:var(--quiet);white-space:nowrap}
.conversation-meta .badge{height:17px;min-width:17px;font-size:10px;padding:0 5px;line-height:17px}
.home-indicator{position:absolute;left:141px;bottom:11px;width:120px;height:4px;border-radius:2px;background:#e9edf2;opacity:.8}
canvas{display:block;flex:none}
</style>
</head>
<body>
<main class="phone" aria-label="消息首页正常状态">
  <div class="status"><span>9:41</span><div class="status-right" aria-hidden="true"><span class="bars"><i></i><i></i><i></i><i></i></span><canvas data-icon="wifi" data-size="17" data-color="#e9edf2"></canvas><span class="battery"></span></div></div>
  <header class="nav"><button class="icon-button" aria-label="返回导航树"><span class="back"></span></button><h1>消息</h1><button class="icon-button" aria-label="搜索当前身份的会话"><canvas data-icon="search" data-size="22" data-color="#cdd7e1"></canvas></button></header>
  <nav class="quick-links" aria-label="消息分类">
    <button class="quick-link"><span class="quick-icon"><canvas data-icon="heart" data-size="25"></canvas><span class="badge">12</span></span><span class="quick-label">点赞</span></button>
    <button class="quick-link"><span class="quick-icon"><canvas data-icon="comment" data-size="25"></canvas><span class="badge">3</span></span><span class="quick-label">评论与回复</span></button>
    <button class="quick-link"><span class="quick-icon"><canvas data-icon="bell" data-size="24"></canvas><span class="red-dot" aria-label="有未读系统通知"></span></span><span class="quick-label">系统通知</span></button>
  </nav>
  <div class="identity-bar"><button class="identity-switch" aria-label="切换消息身份，其他身份有未读消息"><span class="identity-dot"><span class="red-dot"></span></span></button></div>
  <section class="conversations" aria-label="当前身份的会话列表">
    <div class="pinned-group" aria-label="置顶会话">
      <article class="conversation pinned unread">
        <span class="avatar owner" aria-hidden="true"><i></i></span>
        <div class="conversation-copy"><div class="name-line"><span class="name">楼主昵称</span><canvas class="pin" data-icon="pin" data-size="11" data-color="#718594"></canvas></div><div class="summary">我在二楼靠窗，到了告诉我。</div></div>
        <div class="conversation-meta"><time class="time">09:36</time><span class="badge">2</span></div>
      </article>
      <article class="conversation pinned">
        <span class="avatar a" aria-hidden="true"><i></i></span>
        <div class="conversation-copy"><div class="name-line"><span class="name">评论者A</span><canvas class="pin" data-icon="pin" data-size="11" data-color="#718594"></canvas></div><div class="summary">[图片]</div></div>
        <div class="conversation-meta"><time class="time">08:52</time></div>
      </article>
    </div>
    <div class="regular-group" aria-label="按最新消息排列的会话">
      <article class="conversation unread">
        <span class="avatar b" aria-hidden="true"><i></i></span>
        <div class="conversation-copy"><div class="name-line"><span class="name">评论者B</span></div><div class="summary">好，我两点左右到。</div></div>
        <div class="conversation-meta"><time class="time">09:39</time><span class="badge">3</span></div>
      </article>
      <article class="conversation">
        <span class="avatar c" aria-hidden="true"><i></i></span>
        <div class="conversation-copy"><div class="name-line"><span class="name">评论者C</span></div><div class="summary">收到，谢谢。</div></div>
        <div class="conversation-meta"><time class="time">08:24</time></div>
      </article>
      <article class="conversation">
        <span class="avatar d" aria-hidden="true"><i></i></span>
        <div class="conversation-copy"><div class="name-line"><span class="name">评论者D</span></div><div class="summary">明天下午也可以一起。</div></div>
        <div class="conversation-meta"><time class="time">昨天</time></div>
      </article>
      <article class="conversation">
        <span class="avatar e" aria-hidden="true"><i></i></span>
        <div class="conversation-copy"><div class="name-line"><span class="name">评论者E</span></div><div class="summary">那就在图书馆门口见。</div></div>
        <div class="conversation-meta"><time class="time">周五</time></div>
      </article>
    </div>
  </section>
  <div class="home-indicator" aria-hidden="true"></div>
</main>
<script>
// Draw the small interface icons directly on canvas. No remote assets required.
for(const canvas of document.querySelectorAll('canvas[data-icon]')){
  const size=Number(canvas.dataset.size),scale=3;
  canvas.width=size*scale;canvas.height=size*scale;canvas.style.width=size+'px';canvas.style.height=size+'px';
  const c=canvas.getContext('2d');c.scale(size*scale/24,size*scale/24);
  c.strokeStyle=canvas.dataset.color||'#b4d9e9';c.fillStyle=c.strokeStyle;c.lineWidth=1.55;c.lineCap='round';c.lineJoin='round';
  const path=(points)=>{c.beginPath();points(c);c.stroke();};
  switch(canvas.dataset.icon){
    case 'heart':path(p=>{p.moveTo(12,20.5);p.bezierCurveTo(8.9,17.8,3.2,13.4,3.2,8.7);p.bezierCurveTo(3.2,3.8,9.1,2.5,12,6.4);p.bezierCurveTo(14.9,2.5,20.8,3.8,20.8,8.7);p.bezierCurveTo(20.8,13.4,15.1,17.8,12,20.5);});break;
    case 'comment':path(p=>{p.moveTo(5.2,17.5);p.lineTo(3.6,21);p.lineTo(8.1,19.6);p.bezierCurveTo(14.3,22.1,21,18.1,21,11.8);p.bezierCurveTo(21,6.8,17.2,3,12.1,3);p.bezierCurveTo(7.0,3,3.2,6.8,3.2,11.8);p.bezierCurveTo(3.2,14.0,3.9,16,5.2,17.5);});for(const x of [8,12,16]){c.beginPath();c.arc(x,11.6,.85,0,Math.PI*2);c.fill();}break;
    case 'bell':path(p=>{p.moveTo(7.2,7.8);p.bezierCurveTo(7.2,1.8,16.8,1.8,16.8,7.8);p.lineTo(17.4,13.5);p.bezierCurveTo(17.5,14.7,18.8,16,19.1,17);p.lineTo(4.9,17);p.bezierCurveTo(5.2,16,6.5,14.7,6.6,13.5);p.closePath();});path(p=>{p.moveTo(9.7,20);p.bezierCurveTo(10.7,21.5,13.3,21.5,14.3,20);});break;
    case 'search':path(p=>{p.arc(10.2,10.2,6.4,0,Math.PI*2);});path(p=>{p.moveTo(15,15);p.lineTo(20.3,20.3);});break;
    case 'pin':c.lineWidth=1.7;path(p=>{p.moveTo(8,3.4);p.lineTo(17,3.4);p.moveTo(9.2,3.4);p.lineTo(9.2,9);p.lineTo(6.3,13);p.lineTo(18.7,13);p.lineTo(15.8,9);p.lineTo(15.8,3.4);p.moveTo(12.5,13);p.lineTo(12.5,20.5);});break;
    case 'wifi':c.lineWidth=2;path(p=>{p.moveTo(2,8);p.quadraticCurveTo(12,-.2,22,8);p.moveTo(6.1,12.2);p.quadraticCurveTo(12,7.3,17.9,12.2);});c.beginPath();c.arc(12,17.2,1.35,0,Math.PI*2);c.fill();break;
  }
}
</script>
</body>
</html>
