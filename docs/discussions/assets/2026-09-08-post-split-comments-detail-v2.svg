<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="770" viewBox="0 0 1000 770"><title>楼中楼：默认最多展示3条回复</title><desc>评论内容结构放大示意，不是加高手机评论区。评论区仍为246像素，独立滚动。只绘制3条默认回复，其余2条在点击展开后才呈现。</desc><rect width="1000" height="770" fill="#070A0F"/><g font-family="PingFang SC,Noto Sans SC,Helvetica Neue,Arial,sans-serif" text-rendering="optimizeLegibility"><text x="54" y="51" font-size="22" fill="#ECF0F5" font-weight="600">楼中楼回复</text><text x="54" y="81" font-size="13" fill="#9EAEBF" >评论内容结构放大示意 · 手机评论区仍为 246 px，可独立滚动</text><rect x="54" y="118" width="603" height="576" rx="22" fill="#10161F" stroke="#313A45"/><g transform="translate(54 150) scale(1.5)"><g transform="translate(0 0)" data-thread="comment-a" data-default-visible-replies="3" data-hidden-replies="2"><svg x="26" y="0" width="24" height="24" viewBox="0 0 32 32" aria-label="评论者A头像" data-identity="a"><circle cx="16" cy="16" r="16" fill="#303D3C"/><rect x="10" y="10" width="12" height="12" rx="3" fill="#B8CCC0"/></svg><text x="58" y="17" font-size="12.5" fill="#B8DEEF" font-weight="500">评论者A</text><text x="117" y="17" font-size="10.5" fill="#9EAEBF" >· 1楼</text><svg x="347.5" y="5.5" width="15" height="15" viewBox="0 0 24 24"><path d="M20.8 4.9a5.5 5.5 0 0 0-7.8 0L12 6l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.3a5.5 5.5 0 0 0 0-7.8Z" fill="none" stroke="#9EAEBF" stroke-width="1.6" stroke-linejoin="round"/></svg><text x="370" y="17" font-size="10.5" fill="#9EAEBF" >6</text><text x="58" y="43" font-size="13.5" fill="#ECF0F5" >我两点能到，二楼靠窗的位置怎么样？</text><text x="58" y="63" font-size="10.5" fill="#9EAEBF" >刚刚</text><path d="M36 79v250" stroke="#34414E" stroke-width="1.5"/><g data-reply-index="1" aria-label="评论者B 回复 评论者A"><svg x="48" y="78" width="20" height="20" viewBox="0 0 32 32" aria-label="评论者B头像" data-identity="b"><circle cx="16" cy="16" r="16" fill="#3B3548"/><path d="m16 8 8 8-8 8-8-8Z" fill="#C5BDDB"/></svg><text x="76" y="93" font-size="12" fill="#B8DEEF" font-weight="500">评论者B</text><text x="133" y="93" font-size=