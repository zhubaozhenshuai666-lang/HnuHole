<svg xmlns="http://www.w3.org/2000/svg" width="402" height="874" viewBox="0 0 402 874"><title>帖子详情：默认阅读</title><defs><clipPath id="screen-read"><rect width="402" height="874" rx="36"/></clipPath><clipPath id="article-read"><rect x="0" y="100" width="402" height="690"/></clipPath><clipPath id="comments-list"><rect x="0" y="635" width="402" height="203"/></clipPath></defs><g font-family="PingFang SC,Noto Sans SC,Helvetica Neue,Arial,sans-serif" text-rendering="optimizeLegibility" clip-path="url(#screen-read)"><rect width="402" height="874" fill="#0B0E14"/><text x="27" y="29" font-size="13" fill="#ECF0F5" font-weight="600">9:41</text><g fill="#ECF0F5"><rect x="304" y="23" width="3" height="4" rx=".8"/><rect x="309" y="20" width="3" height="7" rx=".8"/><rect x="314" y="17" width="3" height="10" rx=".8"/><rect x="319" y="14" width="3" height="13" rx=".8"/></g><g transform="translate(330 15)" fill="none" stroke="#ECF0F5" stroke-width="1.6" stroke-linecap="round"><path d="M0 4q7-6 14 0M3 7q4-3 8 0"/><circle cx="7" cy="10" r="1" fill="#ECF0F5" stroke="none"/></g><rect x="355" y="16" width="23" height="11" rx="3" fill="none" stroke="#9EAEBF" stroke-width="1"/><rect x="357" y="18" width="17" height="7" rx="1.5" fill="#ECF0F5"/><path d="M380 19v5" stroke="#9EAEBF" stroke-width="2" stroke-linecap="round"/><path d="M37 62l-8 8 8 8" fill="none" stroke="#ECF0F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><g clip-path="url(#article-read)" aria-label="帖子正文"><text x="26" y="146" font-size="26" fill="#ECF0F5" font-weight="600" letter-spacing=".25">周末想找人</text><text x="26" y="183" font-size="26" fill="#ECF0F5" font-weight="600" letter-spacing=".25">一起去图书馆</text><text x="26" y="236" font-size="15" fill="#CFD7E1" >周六下午想去图书馆看书，两点左右到。</text><text x="26" y="262" font-size="15" fill="#CFD7E1" >一个人容易走神，想找个搭子一起。</text><text x="26" y="310" font-size="15" fill="#CFD7E1" >暂定待到五点，各自学习就好。</text><text x="26" y="336" font-size="15" fill="#CFD7E1" >中间可以一起休息，不用一直聊天。</text><text x="26" y="384" font-size="15" fill="#CFD7E1" >我准备复习英语，也会带电脑。</text><text x="26" y="410" font-size="15" fill="#CFD7E1" >如果你也有作业或考试，可以一起坐。</text><text x="26" y="458" font-size="15" fill="#CFD7E1" >位置还没定，想找相对安静一点的区域。</text><text x="26" y="484" font-size="15" fill="#CFD7E1" >有推荐的楼层，也可以在评论里说。</text><text x="26" y="532" font-size="15" fill="#CFD7E1" >平时周末也会去，这次先约一个下午。</text><text x="26" y="558" font-size="15" fill="#CFD7E1" >时间不完全一样也没关系，晚点来可以。</text><text x="26" y="606" font-size="15" fill="#CFD7E1" >带好自己的书和水就行。</text><text x="26" y="632" font-size="15" fill="#CFD7E1" >愿意一起的话，留个大概能到的时间吧。</text></g><g aria-label="帖子操作"><rect x="0" y="790" width="402" height="48" fill="#0B0E14"/><path d="M24 790h354" stroke="#26313D"/><svg x="25" y="804" width="20" height="20" viewBox="0 0 24 24"><path d="M20.5 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.6 0-3.1-.4-4.4-1.2L3.5 20l1.2-4.1a8.5 8.5 0 1 1 15.8-4.4Z" fill="none" stroke="#ECF0F5" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="54" y="818" font-size="13" fill="#ECF0F5" >评论</text><text x="86" y="818" font-size="12" fill="#ECF0F5" >12</text><svg x="248" y="804" width="18" height="18" viewBox="0 0 24 24"><path d="M20.8 4.9a5.5 5.5 0 0 0-7.8 0L12 6l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.3a5.5 5.5 0 0 0 0-7.8Z" fill="none" stroke="#9EAEBF" stroke-width="1.6" stroke-linejoin="round"/></svg><text x="273" y="818" font-size="12" fill="#9EAEBF" >28</text><path d="M319 805h12v17l-6-4-6 4Z" fill="none" stroke="#9EAEBF" stroke-width="1.5" stroke-linejoin="round"/><text x="341" y="818" font-size="12" fill="#9EAEBF" >收藏</text></g><rect x="0" y="838" width="402" height="36" fill="#0B0E14"/><rect x="141" y="859" width="120" height="4" rx="2" fill="#ECF0F5" opacity=".8"/></g><rect x=".5" y=".5" width="401" height="873" rx="35.5" fill="none" stroke="#313A45"/></svg>