<svg xmlns="http://www.w3.org/2000/svg" width="402" height="874" viewBox="0 0 402 874"><title>帖子详情：展开评论</title><defs><clipPath id="screen-comments"><rect width="402" height="874" rx="36"/></clipPath><clipPath id="article-comments"><rect x="0" y="100" width="402" height="444"/></clipPath><clipPath id="comments-list"><rect x="0" y="635" width="402" height="203"/></clipPath></defs><g font-family="PingFang SC,Noto Sans SC,Helvetica Neue,Arial,sans-serif" text-rendering="optimizeLegibility" clip-path="url(#screen-comments)"><rect width="402" height="874" fill="#0B0E14"/><text x="27" y="29" font-size="13" fill="#ECF0F5" font-weight="600">9:41</text><g fill="#ECF0F5"><rect x="304" y="23" width="3" height="4" rx=".8"/><rect x="309" y="20" width="3" height="7" rx=".8"/><rect x="314" y="17" width="3" height="10" rx=".8"/><rect x="319" y="14" width="3" height="13" rx=".8"/></g><g transform="translate(330 15)" fill="none" stroke="#ECF0F5" stroke-width="1.6" stroke-linecap="round"><path d="M0 4q7-6 14 0M3 7q4-3 8 0"/><circle cx="7" cy="10" r="1" fill="#ECF0F5" stroke="none"/></g><rect x="355" y="16" width="23" height="11" rx="3" fill="none" stroke="#9EAEBF" stroke-width="1"/><rect x="357" y="18" width="17" height="7" rx="1.5" fill="#ECF0F5"/><path d="M380 19v5" stroke="#9EAEBF" stroke-width="2" stroke-linecap="round"/><path d="M37 62l-8 8 8 8" fill="none" stroke="#ECF0F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><g clip-path="url(#article-comments)" aria-label="帖子正文"><svg x="264" y="134" width="34" height="34" viewBox="0 0 32 32" aria-label="楼主昵称头像" data-identity="owner"><circle cx="16" cy="16" r="16" fill="#273E4D"/><circle cx="16" cy="16" r="6" fill="#A9D6E8"/></svg><text x="307" y="156" font-size="12.5" fill="#B8DEEF" font-weight="500" data-identity="owner">楼主昵称</text><text x="26" y="146" font-size="26" fill="#ECF0F5" font-weight="600" letter-spacing=".25">周末想找人</text><text x="26" y="183" font-size="26" fill="#ECF0F5" font-weight="600" letter-spacing=".25">一起去图书馆</text><text x="26" y="236" font-size="15" fill="#CFD7E1" >周六下午想去图书馆看书，两点左右到。</text><text x="26" y="262" font-size="15" fill="#CFD7E1" >一个人容易走神，想找个搭子一起。</text><text x="26" y="310" font-size="15" fill="#CFD7E1" >暂定待到五点，各自学习就好。</text><text x="26" y="336" font-size="15" fill="#CFD7E1" >中间可以一起休息，不用一直聊天。</text><text x="26" y="384" font-size="15" fill="#CFD7E1" >我准备复习英语，也会带电脑。</text><text x="26" y="410" font-size="15" fill="#CFD7E1" >如果你也有作业或考试，可以一起坐。</text><text x="26" y="458" font-size="15" fill="#CFD7E1" >位置还没定，想找相对安静一点的区域。</text><text x="26" y="484" font-size="15" fill="#CFD7E1" >有推荐的楼层，也可以在评论里说。</text><text x="26" y="532" font-size="15" fill="#CFD7E1" >平时周末也会去，这次先约一个下午。</text><text x="26" y="558" font-size="15" fill="#CFD7E1" >时间不完全一样也没关系，晚点来可以。</text><text x="26" y="606" font-size="15" fill="#CFD7E1" >带好自己的书和水就行。</text><text x="26" y="632" font-size="15" fill="#CFD7E1" >愿意一起的话，留个大概能到的时间吧。</text><rect x="391" y="173" width="2.5" height="167" rx="1.25" fill="#637587" opacity=".65"/></g><g aria-label="帖子操作"><rect x="0" y="544" width="402" height="48" fill="#0B0E14"/><path d="M24 544h354" stroke="#26313D"/><svg x="25" y="558" width="20" height="20" viewBox="0 0 24 24"><path d="M20.5 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.6 0-3.1-.4-4.4-1.2L3.5 20l1.2-4.1a8.5 8.5 0 1 1 15.8-4.4Z" fill="none" stroke="#B8DEEF" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="54" y="572" font-size="13" fill="#B8DEEF" >评论</text><text x="86" y="572" font-size="12" fill="#B8DEEF" >12</text><svg x="248" y="558" width="18" height="18" viewBox="0 0 24 24"><path d="M20.8 4.9a5.5 5.5 0 0 0-7.8 0L12 6l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.3a5.5 5.5 0 0 0 0-7.8Z" fill="none" stroke="#9EAEBF" stroke-width="1.6" stroke-linejoin="round"/></svg><text x="273" y="572" font-size="12" fill="#9EAEBF" >28</text><svg x="315" y="557" width="20" height="20" viewBox="0 0 24 24" aria-label="星形收藏"><path d="m12 2.7 2.9 5.88 6.49.95-4.7 4.58 1.11 6.46L12 17.52l-5.8 3.05 1.11-6.46-4.7-4.58 6.49-.95Z" fill="none" stroke="#9EAEBF" stroke-width="1.6" stroke-linejoin="round"/></svg><text x="341" y="572" font-size="12" fill="#9EAEBF" >收藏</text></g><g aria-label="评论区域"><rect x="0" y="592" width="402" height="246" fill="#10161F"/><path d="M0 592h402" stroke="#384653"/><text x="26" y="619" font-size="13" fill="#ECF0F5" font-weight="600">评论</text><text x="59" y="619" font-size="11.5" fill="#9EAEBF">12</text><g aria-label="评论列表" clip-path="url(#comments-list)"><g transform="translate(0 640)" data-thread="comment-a" data-default-visible-replies="3" data-hidden-replies="2"><svg x="26" y="0" width="24" height="24" viewBox="0 0 32 32" aria-label="评论者A头像" data-identity="a"><circle cx="16" cy="16" r="16" fill="#303D3C"/><rect x="10" y="10" width="12" height="12" rx="3" fill="#B8CCC0"/></svg><text x="58" y="17" font-size="12.5" fill="#B8DEEF" font-weight="500">评论者A</text><text x="117" y="17" font-size="10.5" fill="#9EAEBF" >· 1楼</text><svg x="347.5" y="5.5" width="15" height="15" viewBox="0 0 24 24"><path d="M20.8 4.9a5.5 5.5 0 0 0-7.8 0L12 6l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.3a5.5 5.5 0 0 0 0-7.8Z" fill="none" stroke="#9EAEBF" stroke-width="1.6" stroke-linejoin="round"/></svg><text x="370" y="17" font-size="10.5" fill="#9EAEBF" >6</text><text x="58" y="43" font-size="13.5" fill="#ECF0F5" >我两点能到，二楼靠窗的位置怎么样？</text><text x="58" y="63" font-size="10.5" fill="#9EAEBF" >刚刚</text><path d="M36 79v250" stroke="#34414E" stroke-width="1.5"/><g data-reply-index="1" aria-label="评论者B 回复 评论者A"><svg x="48" y="78" width="20" height="20" viewBox="0 0 32 32" aria-label="评论者B头像" data-identity="b"><circle cx="16" cy="16" r="16" fill="#3B3548"/><path d="m16 8 8 8-8 8-8-8Z" fill="#C5BDDB"/></svg><text x="76" y="93" font-size="12" fill="#B8DEEF" font-weight="500">评论者B</text><text x="133" y="93" font-size="11" fill="#9EAEBF" >回复</text><text x="164" y="93" font-size="12" fill="#B8DEEF" font-weight="500">评论者A</text><svg x="347.5" y="81.5" width="15" height="15" viewBox="0 0 24 24"><path d="M20.8 4.9a5.5 5.5 0 0 0-7.8 0L12 6l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.3a5.5 5.5 0 0 0 0-7.8Z" fill="#B8DEEF" stroke="#B8DEEF" stroke-width="1.6" stroke-linejoin="round"/></svg><text x="370" y="93" font-size="10.5" fill="#B8DEEF" >2</text><text x="76" y="118" font-size="13" fill="#ECF0F5" >可以，我到的时候在这条评论下说。</text><text x="76" y="138" font-size="10.5" fill="#9EAEBF" >刚刚</text></g><g data-reply-index="2" aria-label="楼主昵称 回复 评论者B"><svg x="48" y="156" width="20" height="20" viewBox="0 0 32 32" aria-label="楼主昵称头像" data-identity="owner"><circle cx="16" cy="16" r="16" fill="#273E4D"/><circle cx="16" cy="16" r="6" fill="#A9D6E8"/></svg><text x="76" y="171" font-size="12" fill="#B8DEEF" font-weight="500">楼主昵称</text><g aria-label="楼主标识"><rect x="129" y="158" width="29" height="17" rx="4" fill="#223B49"/><text x="143.5" y="170.5" font-size="9.5" fill="#B8DEEF" text-anchor="middle" font-weight="500">楼主</text></g><text x="167" y="171" font-size="11" fill="#9EAEBF" >回复</text><text x="198" y="171" font-size="12" fill="#B8DEEF" font-weight="500">评论者B</text><svg x="347.5" y="159.5" width="15" height="15" viewBox="0 0 24 24"><path d="M20.8 4.9a5.5 5.5 0 0 0-7.8 0L12 6l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.3a5.5 5.5 0 0 0 0-7.8Z" fill="none" stroke="#9EAEBF" stroke-width="1.6" stroke-linejoin="round"/></svg><text x="370" y="171" font-size="10.5" fill="#9EAEBF" >3</text><text x="76" y="196" font-size="13" fill="#ECF0F5" >好，那就二楼靠窗，到了在这里说。</text><text x="76" y="216" font-size="10.5" fill="#9EAEBF" >刚刚</text></g><g data-reply-index="3" aria-label="评论者C 回复 评论者A"><svg x="48" y="234" width="20" height="20" viewBox="0 0 32 32" aria-label="评论者C头像" data-identity="c"><circle cx="16" cy="16" r="16" fill="#443C31"/><path d="m16 8 8 15H8Z" fill="#DCC7A3"/></svg><text x="76" y="249" font-size="12" fill="#B8DEEF" font-weight="500">评论者C</text><text x="133" y="249" font-size="11" fill="#9EAEBF" >回复</text><text x="164" y="249" font-size="12" fill="#B8DEEF" font-weight="500">评论者A</text><svg x="347.5" y="237.5" width="15" height="15" viewBox="0 0 24 24"><path d="M20.8 4.9a5.5 5.5 0 0 0-7.8 0L12 6l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.3a5.5 5.5 0 0 0 0-7.8Z" fill="none" stroke="#9EAEBF" stroke-width="1.6" stroke-linejoin="round"/></svg><text x="370" y="249" font-size="10.5" fill="#9EAEBF" >0</text><text x="76" y="274" font-size="13" fill="#ECF0F5" >我三点到，也可以一起。</text><text x="76" y="294" font-size="10.5" fill="#9EAEBF" >1 分钟前</text></g><g aria-label="展开其余2条回复" data-action="expand-remaining-replies"><text x="76" y="329" font-size="12" fill="#B8DEEF" >展开其余 2 条回复</text><path d="m191 321 4 4 4-4" fill="none" stroke="#B8DEEF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></g></g><rect x="391" y="647" width="2.5" height="57" rx="1.25" fill="#637587" opacity=".72"/></g></g><rect x="0" y="838" width="402" height="36" fill="#10161F"/><rect x="141" y="859" width="120" height="4" rx="2" fill="#ECF0F5" opacity=".8"/></g><rect x=".5" y=".5" width="401" height="873" rx="35.5" fill="none" stroke="#313A45"/></svg>