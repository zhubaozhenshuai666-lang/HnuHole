services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hnuhole
      POSTGRES_USER: hnuhole
      POSTGRES_PASSWORD: hnuhole_dev_only
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"
